name: Pruebas del catálogo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pruebas:
    name: Comprobar reglas comerciales
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      # Nuevas pruebas visuales usan sharp; instalar dependencias de forma explícita.
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test
